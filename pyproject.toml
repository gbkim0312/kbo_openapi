[project]
name = "kbo-result-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30", "alembic>=1.14", "httpx>=0.28", "beautifulsoup4>=4.12",
  "pydantic-settings>=2.6", "apscheduler>=3.10", "psycopg[binary]>=3.2"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the live KBO site"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
